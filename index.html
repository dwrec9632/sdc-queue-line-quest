<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDC Queue Line Quest</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui;color:#f8f1df;background:#0b292d;display:flex;justify-content:center;padding:0 0 40px;position:relative}

.app{width:min(100%,580px);position:relative;z-index:1}
header{text-align:center;padding:10px 5px 20px;text-shadow:0 3px 12px #000}
header small{letter-spacing:.18em;color:#f0c979;font-weight:900}
h1{font-family:Georgia,serif;font-size:clamp(2.5rem,10vw,4rem);line-height:.9;margin:10px 0;text-shadow:0 4px 16px #000}
.card{background:linear-gradient(180deg,rgba(8,57,64,.97),rgba(5,40,47,.98));color:#fff7e9;border:4px solid #6f4a2d;border-radius:18px;padding:21px;box-shadow:0 18px 45px #0009,inset 0 0 0 2px #b7864c}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}.stat{text-align:center;background:linear-gradient(#6f4b2e,#4c321f);border:1px solid #b98750;border-radius:10px;padding:10px;color:#fff4dc}.stat b{display:block;font-size:1.3rem;color:#73d6e3}.stat span{font-size:.72rem}label{display:block;font-weight:800;margin-bottom:7px}input{width:100%;padding:14px;border:2px solid #b7864c;border-radius:10px;font-size:1rem;margin-bottom:12px;background:#f9f1df;color:#17282a}.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:900;font-size:1rem;cursor:pointer}.primary{background:linear-gradient(#14758a,#0b5263);color:white;border:1px solid #65c7d5;box-shadow:inset 0 -3px 0 #073942}.secondary{background:linear-gradient(#705035,#4e3524);color:#fff4dc;border:1px solid #b98750;margin-top:9px}.top{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800;color:#f1d79f}.bar{height:8px;background:#102f35;border:1px solid #86613d;border-radius:99px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;background:#39a9bb}.cat{display:inline-block;background:linear-gradient(#8a633e,#604329);color:#fff3d4;border:1px solid #c39458;padding:5px 9px;border-radius:99px;font-size:.68rem;font-weight:900;text-transform:uppercase}.q{font-family:Georgia,serif;font-size:1.5rem;line-height:1.2;text-shadow:0 2px 4px #000}.answers{display:grid;gap:9px}.answer{padding:14px;text-align:left;border:2px solid #765337;border-radius:10px;background:linear-gradient(180deg,#0c5360,#083e49);color:#fff8e8;font-weight:750;cursor:pointer;box-shadow:inset 0 0 0 1px #1f7480}.answer.correct{background:linear-gradient(#176d3c,#0d4f2b);border-color:#77d88d;box-shadow:0 0 12px #51d46a88}.answer.wrong{background:linear-gradient(#7b342e,#56231f);border-color:#dc8278}.answer:disabled{opacity:1;color:#fff8e8}.feedback{margin-top:15px;background:linear-gradient(#563a25,#3d291c);border:2px solid #9e7447;border-radius:10px;padding:14px;color:#fff4dc}.feedback p{line-height:1.4}.results{text-align:center}.score{font-size:3.5rem;font-weight:950;color:#6ed5e2;margin:10px}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:15px 0}.breakdown div{background:#523821;border:1px solid #9d7346;border-radius:8px;padding:9px;font-size:.75rem;font-weight:700;color:#fff4dc}.footer{text-align:center;font-size:.7rem;color:#bed2d0;margin-top:12px}

.water-sheen{position:fixed;left:-10%;right:-10%;bottom:-35px;height:120px;z-index:0;opacity:.22;pointer-events:none;background:repeating-radial-gradient(ellipse at 50% 100%,rgba(112,221,236,.75) 0 2px,transparent 3px 18px);animation:riverMove 8s linear infinite}
@keyframes riverMove{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
@media(max-width:600px){body{background-attachment:scroll;background-position:center top}.mast{min-height:245px;display:flex;flex-direction:column;justify-content:flex-start}.card{backdrop-filter:blur(2px)}}

.hero{height:clamp(300px,58vh,520px);width:100%;position:relative;background:url('mystic-river-falls.png') center 42%/cover no-repeat;border-bottom:5px solid #6f4a2d;box-shadow:0 12px 30px #0008}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,20,22,.05),rgba(3,20,22,.05) 50%,rgba(3,20,22,.78) 100%)}
.hero-title{position:absolute;z-index:2;left:0;right:0;bottom:20px;text-align:center;padding:0 16px;text-shadow:0 4px 12px #000}
.hero-title small{display:block;letter-spacing:.18em;color:#f0c979;font-weight:900;font-size:.72rem}
.hero-title h1{font-family:Georgia,serif;font-size:clamp(2.7rem,11vw,4.3rem);line-height:.88;margin:8px 0 0}
.game-wrap{width:min(calc(100% - 24px),580px);margin:-12px auto 0;position:relative;z-index:3}
.app{width:100%}
header.mast{display:none!important}
@media(max-width:600px){.hero{height:360px;background-position:center 38%}.game-wrap{margin-top:-16px}.card{border-radius:16px}}

/* V5 image-quality adjustment */
.hero{
  height:auto!important;
  aspect-ratio:1080/613;
  max-height:none!important;
  background-image:url('mystic-river-falls.png')!important;
  background-size:100% auto!important;
  background-position:center top!important;
  background-repeat:no-repeat!important;
}
.hero-title{bottom:9%!important}
.game-wrap{margin-top:-10px!important}
@media(max-width:600px){
  .hero{height:auto!important;aspect-ratio:1080/613;background-size:100% auto!important;background-position:center top!important}
  .hero-title h1{font-size:clamp(2.25rem,10vw,3.4rem)}
  .hero-title small{font-size:.64rem}
  .game-wrap{margin-top:-10px!important}
}

.leaderboard{margin:18px 0 14px;text-align:left;background:#062f37;border:2px solid #8d673f;border-radius:12px;padding:12px}
.leaderboard h3{text-align:center;margin:2px 0 10px;font-family:Georgia,serif;color:#f4d89c}
.lb-row{display:grid;grid-template-columns:38px 1fr 55px 58px;gap:6px;align-items:center;padding:8px 5px;border-top:1px solid #31535a;font-size:.82rem}
.lb-row:first-of-type{border-top:0}.lb-rank{font-weight:900;color:#f0c979}.lb-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb-score{font-weight:900;text-align:right}.lb-time{text-align:right;color:#b9d4d7;font-size:.72rem}
.lb-you{background:#0d5966;border-radius:7px}.lb-status{text-align:center;color:#c7dcda;font-size:.78rem;padding:7px}
.player-rank{margin:10px 0;padding:10px;border-radius:10px;background:#523821;border:1px solid #9d7346;color:#fff4dc;font-weight:800}



.name-tools{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.name-tools button{width:auto;min-height:42px;padding:9px 14px;font-size:.85rem}
.name-msg{min-height:1.2em;margin-top:7px;font-size:.78rem;font-weight:700;color:#ffd58a}
.name-msg.bad{color:#ffb0a7}
</style></head><body><div class="water-sheen"></div>
<div style="width:100%">
<section class="hero">
  <div class="hero-title">
    <small>SDC QUEUE LINE QUEST</small>
    <h1 id="heroGameTitle">Loading Game…</h1>
  </div>
</section>
<div class="game-wrap"><main class="app"><header><small>TURN YOUR WAIT INTO AN ADVENTURE</small><h1>SDC Queue Line Quest</h1><p id="gameSubtitle">Loading your quest…</p></header>
<section id="start" class="card"><div class="stats"><div class="stat"><b>10</b><span>Questions</span></div><div class="stat"><b>LIVE</b><span>Question Bank</span></div><div class="stat"><b>~3</b><span>Minutes</span></div></div><label>Choose your player name</label><input id="name" maxlength="18" placeholder="Example: TrailRider"><div class="name-tools"><button type="button" id="randomNameBtn" class="secondary">🎲 GIVE ME A QUEST NAME</button></div><div id="nameMsg" class="name-msg" aria-live="polite"></div><button id="startBtn" class="btn primary" disabled>LOADING QUEST...</button></section>
<section id="quiz" class="card hidden"><div class="top"><span id="count"></span><span id="scoreText"></span></div><div class="bar"><div id="progress" class="fill"></div></div><span id="cat" class="cat"></span><h2 id="question" class="q"></h2><div id="answers" class="answers"></div><div id="feedback" class="feedback hidden"><b id="fbtitle"></b><p id="fact"></p><button id="next" class="btn primary">NEXT QUESTION →</button></div></section>
<section id="results" class="card results hidden"><h2 id="rank"></h2><div id="final" class="score"></div><p id="copy"></p><div id="breakdown" class="breakdown"></div>
<div id="playerRank" class="player-rank hidden"></div>
<div class="leaderboard">
  <h3>🏆 Quest Leaderboard</h3>
  <div id="lbStatus" class="lb-status">Loading leaderboard…</div>
  <div id="lbRows"></div>
</div>
<button id="again" class="btn primary">PLAY AGAIN</button><button id="newname" class="btn secondary">CHANGE NAME</button></section><div class="footer">SDC Queue Line Quest • V21</div></main></div></div>
<script>
let bank=[];
const SUPABASE_URL="https://jrvegxhfwnytphdnkobp.supabase.co";
const SUPABASE_KEY="sb_publishable_Rclep80mOH2QMXBXNHJlJQ_KrKISheH";

const params=new URLSearchParams(window.location.search);
const GAME_SLUG=(params.get("game")||"mystic-river-falls").toLowerCase().trim();
let currentGameId=null;
let currentGameName="Ride Queue Trivia";

async function loadQuestions(){
  const gameResp=await fetch(`${SUPABASE_URL}/rest/v1/games?slug=eq.${encodeURIComponent(GAME_SLUG)}&is_active=eq.true&select=id,slug,name,subtitle,hero_image_url&limit=1`,{
    headers:{apikey:SUPABASE_KEY}
  });
  if(!gameResp.ok) throw new Error(`Game lookup failed (${gameResp.status})`);
  const games=await gameResp.json();
  if(!games.length) throw new Error("Game is not active or could not be found.");

  const game=games[0];
  const gameId=game.id;
  currentGameId=gameId;
  currentGameName=game.name||"Ride Queue Trivia";
  document.title=`${currentGameName} | SDC Queue Line Quest`;

  // Apply this game's hero image from Supabase.
  const heroUrl=game.hero_image_url||"mystic-river-falls.png";
  const heroImg=document.querySelector('img[src*="mystic-river-falls"], .hero img, header img');
  if(heroImg){
    heroImg.src=heroUrl;
    heroImg.alt=currentGameName;
  }
  const heroSection=document.querySelector(".hero");
  if(heroSection && !heroImg){
    heroSection.style.backgroundImage=`url("${heroUrl}")`;
    heroSection.style.backgroundSize="cover";
    heroSection.style.backgroundPosition="center";
  }
  const heroTitle=document.getElementById("heroGameTitle");
  if(heroTitle && game.name) heroTitle.textContent=game.name;
  const subtitleEl=document.getElementById("gameSubtitle");
  if(subtitleEl) subtitleEl.textContent=game.subtitle||"Test your knowledge while you wait.";
  const footer=document.querySelector(".footer");
  if(footer) footer.textContent=`SDC Queue Line Quest • ${game.name||"Trivia"} • V21`;
  const qResp=await fetch(`${SUPABASE_URL}/rest/v1/questions?game_id=eq.${gameId}&is_active=eq.true&select=id,question_text,choice_a,choice_b,choice_c,choice_d,correct_choice,fun_fact,category,difficulty&limit=1000`,{
    headers:{apikey:SUPABASE_KEY}
  });
  if(!qResp.ok) throw new Error(`Question load failed (${qResp.status})`);
  const rows=await qResp.json();

  const letterIndex={A:0,B:1,C:2,D:3};
  bank=rows.map(q=>({
    id:q.id,
    question:q.question_text,
    answers:[q.choice_a,q.choice_b,q.choice_c,q.choice_d],
    correct:letterIndex[q.correct_choice],
    fact:q.fun_fact||"",
    category:q.category||"General",
    difficulty:String(q.difficulty||"Easy").toLowerCase()
  }));

  const counts={
    easy:bank.filter(q=>q.difficulty==="easy").length,
    medium:bank.filter(q=>q.difficulty==="medium").length,
    hard:bank.filter(q=>q.difficulty==="hard").length
  };

  if(bank.length<10 || counts.easy<4 || counts.medium<4 || counts.hard<2){
    throw new Error(`Not enough active questions. Need at least 4 Easy, 4 Medium, and 2 Hard.`);
  }
}
let game=[],i=0,score=0,player="",cats={},startedAt=0;
const $=x=>document.getElementById(x);
function shuffle(a){let x=[...a];for(let n=x.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[x[n],x[j]]=[x[j],x[n]]}return x}
function makeGame(){let out=[];for(const [d,n] of [["easy",4],["medium",4],["hard",2]])out.push(...shuffle(bank.filter(q=>q.difficulty===d)).slice(0,n));return shuffle(out)}
function start(){
  const requested=$("name").value.trim()||player||"";
  const cleaned=cleanNickname(requested);
  if(cleaned.length<2 || !nicknameAllowed(cleaned)){
    $("start").classList.remove("hidden");
    $("quiz").classList.add("hidden");
    $("results").classList.add("hidden");
    $("name").value=cleaned;
    $("nameMsg").textContent=cleaned.length<2 ? "Your player name needs at least 2 characters." : "That player name can't be used. Try another one!";
    $("nameMsg").className="name-msg bad";
    $("name").focus();
    return;
  }
  player=cleaned;game=makeGame();i=0;score=0;cats={};startedAt=Date.now();$("start").classList.add("hidden");$("results").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){let q=game[i];$("feedback").classList.add("hidden");$("count").textContent=`Question ${i+1} of 10`;$("scoreText").textContent=`Score: ${score}`;$("progress").style.width=`${i*10}%`;$("cat").textContent=q.category;$("question").textContent=q.question;$("answers").innerHTML="";q.answers.forEach((a,n)=>{let b=document.createElement("button");b.className="answer";b.textContent=a;b.onclick=()=>choose(n,b);$("answers").appendChild(b)})}
function choose(n,b){let q=game[i],bs=[...$("answers").children];bs.forEach(x=>x.disabled=true);if(!cats[q.category])cats[q.category]=[0,0];cats[q.category][1]++;if(n===q.correct){score++;cats[q.category][0]++;b.classList.add("correct");$("fbtitle").textContent="✓ Correct!"}else{b.classList.add("wrong");bs[q.correct].classList.add("correct");$("fbtitle").textContent="Not quite!"}$("scoreText").textContent=`Score: ${score}`;$("fact").textContent=q.fact;$("feedback").classList.remove("hidden");$("next").textContent=i===9?"SEE MY RIVER RANK →":"NEXT QUESTION →"}
function next(){i++;i>=10?finish():render()}
function cleanNickname(raw){
  return String(raw||"").replace(/[^a-zA-Z0-9 _-]/g,"").replace(/\s+/g," ").trim().slice(0,18);
}
const blockedCompactTerms=[
  "fuck","fuk","fuc","fuq","shit","sh1t","bitch","biatch","cunt","dick","cock","pussy",
  "penis","vagina","asshole","azzhole","motherfucker","mfucker","whore","slut","porn",
  "sex","sexy","boob","titty","titties","nigger","nigga","faggot","retard",
  "kike","spic","chink","wetback","rape","rapist","nazi","hitler","kkk"
];
const blockedWholeWords=["ass","fag"];
const leetMap={"0":"o","1":"i","2":"z","3":"e","4":"a","5":"s","6":"g","7":"t","8":"b","9":"g"};
function normalizeLeet(raw){
  return [...String(raw||"").toLowerCase()].map(ch=>leetMap[ch]||ch).join("");
}
function normalizedCompact(raw){
  return normalizeLeet(raw).replace(/[^a-z]/g,"").replace(/(.)\1{2,}/g,"$1$1");
}
function normalizedWords(raw){
  return normalizeLeet(raw)
    .replace(/[^a-z]+/g," ")
    .replace(/\s+/g," ")
    .trim()
    .split(" ")
    .filter(Boolean);
}
function nicknameAllowed(raw){
  const compact=normalizedCompact(raw);
  if(!compact) return false;

  // Strong terms are blocked even when guests try spacing/punctuation/leet substitutions.
  if(blockedCompactTerms.some(term=>compact.includes(normalizedCompact(term)))) return false;

  // Short ambiguous terms are blocked only when they appear as a whole word.
  // This blocks "Ass" or "Big Ass" but does not block names such as "Cassidy".
  const words=normalizedWords(raw);
  if(words.some(word=>blockedWholeWords.includes(word))) return false;

  return true;
}
const riverAdjectives=["Rapid","Misty","Ozark","Wild","Splashy","Rocky","Swift","Silver","Clever","Brave","Lucky","Rustic","Mighty","Hidden","Rushing"];
const riverNouns=["Rider","Otter","Raccoon","Explorer","Raft","Beaver","Trout","Fox","Hawk","Caver","Paddler","Adventurer","Navigator","Scout","Voyager"];
function makeRiverName(){
  const a=riverAdjectives[Math.floor(Math.random()*riverAdjectives.length)];
  const b=riverNouns[Math.floor(Math.random()*riverNouns.length)];
  const num=Math.floor(Math.random()*90)+10;
  return `${a}${b}${num}`.slice(0,18);
}
async function finish(){
  $("quiz").classList.add("hidden");$("results").classList.remove("hidden");
  let r=score===10?"Park Legend 🏆":score>=8?"Park Expert 🌊":score>=6?"Seasoned Explorer 🧭":score>=4?"River Scout 🛶":"New Explorer 🗺️";
  $("rank").textContent=r;$("final").textContent=`${score}/10`;
  $("copy").textContent=`${player}, your ${currentGameName} challenge is complete!`;
  $("breakdown").innerHTML=Object.entries(cats).map(([k,v])=>`<div>${k}<br><b>${v[0]}/${v[1]}</b></div>`).join("");
  const seconds=Math.max(1,Math.round((Date.now()-startedAt)/1000));
  $("lbStatus").textContent="Updating the River Leaderboard…";$("lbRows").innerHTML="";$("playerRank").classList.add("hidden");

  const cleanName=cleanNickname(player)||"Mystery Rider";
  const gameToken=`${currentGameId}|${cleanName}|${score}|${seconds}|${startedAt}`;
  const lastToken=sessionStorage.getItem("mysticLastSubmitted");

  try{
    if(lastToken!==gameToken){
      const res=await fetch(`${SUPABASE_URL}/rest/v1/leaderboard`,{
        method:"POST",
        headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
        body:JSON.stringify({game_id:currentGameId,nickname:cleanName,score:score,time_seconds:seconds})
      });
      if(!res.ok) throw new Error("submit");
      sessionStorage.setItem("mysticLastSubmitted",gameToken);
    }
    await loadLeaderboard(cleanName,score,seconds);
  }catch(e){
    $("lbStatus").textContent="The River Leaderboard couldn't load right now. Your score is still saved above.";
  }
}
async function loadLeaderboard(myName,myScore,myTime){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?game_id=eq.${currentGameId}&select=id,nickname,score,time_seconds,created_at,game_id&order=score.desc,time_seconds.asc,created_at.asc&limit=100`,{
    headers:{"apikey":SUPABASE_KEY}
  });
  if(!res.ok) throw new Error("read");
  const rows=await res.json();
  $("lbStatus").textContent="";
  const myIndex=rows.findIndex(x=>x.nickname===myName&&x.score===myScore&&x.time_seconds===myTime);
  if(myIndex>=0){
    $("playerRank").textContent=`Your current rank: #${myIndex+1} of ${rows.length}`;
    $("playerRank").classList.remove("hidden");
  }
  const top=rows.slice(0,10);
  $("lbRows").innerHTML=top.map((x,n)=>{
    const isYou=n===myIndex;
    const safe=String(x.nickname||"Mystery Rider").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
    const mins=Math.floor((x.time_seconds||0)/60), secs=(x.time_seconds||0)%60;
    const time=x.time_seconds ? (mins?`${mins}:${String(secs).padStart(2,"0")}`:`${secs}s`) : "—";
    return `<div class="lb-row ${isYou?"lb-you":""}"><span class="lb-rank">#${n+1}</span><span class="lb-name">${safe}${isYou?" • YOU":""}</span><span class="lb-score">${x.score}/10</span><span class="lb-time">${time}</span></div>`;
  }).join("");
  if(!top.length)$("lbStatus").textContent="Be the first explorer on the leaderboard!";
}
$("randomNameBtn").onclick=()=>{
  $("name").value=makeRiverName();
  $("nameMsg").textContent="River name ready!";
  $("nameMsg").className="name-msg";
  $("name").focus();
};
$("name").addEventListener("input",()=>{
  $("nameMsg").textContent="";
  $("nameMsg").className="name-msg";
});

async function bootQuest(){
  const btn=$("startBtn");
  try{
    await loadQuestions();
    btn.disabled=false;
    btn.textContent="START QUEST";
    $("nameMsg").textContent="";
    $("nameMsg").className="name-msg";
  }catch(err){
    console.error(err);
    btn.disabled=true;
    btn.textContent="QUEST UNAVAILABLE";
    $("heroGameTitle").textContent="Quest Unavailable";
    $("gameSubtitle").textContent="We couldn't load this trivia game.";
    $("nameMsg").textContent="We couldn't load the trivia questions. Please refresh and try again.";
    $("nameMsg").className="name-msg bad";
  }
}

$("startBtn").onclick=async()=>{
  const cleaned=cleanNickname($("name").value);
  if(cleaned.length<2){
    $("name").value="";
    $("name").placeholder="Enter at least 2 characters";
    $("nameMsg").textContent="Your player name needs at least 2 characters.";
    $("nameMsg").className="name-msg bad";
    $("name").focus();
    return;
  }
  if(!nicknameAllowed(cleaned)){
    $("nameMsg").textContent="That player name can't be used. Try another one!";
    $("nameMsg").className="name-msg bad";
    $("name").focus();
    return;
  }
  $("name").value=cleaned;
  $("nameMsg").textContent="";
  if(!bank.length){
    $("nameMsg").textContent="The quest is still loading. Please try again in a moment.";
    $("nameMsg").className="name-msg bad";
    return;
  }
  start();
};$("name").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("startBtn").click()}};$("next").onclick=next;$("again").onclick=start;$("newname").onclick=()=>{$("results").classList.add("hidden");$("start").classList.remove("hidden");$("name").value=""};bootQuest();
</script></body></html>
